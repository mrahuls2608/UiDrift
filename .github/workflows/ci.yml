name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - name: Server tests (unit, routes, Redis + real Chromium integration)
        run: npm run test:coverage -w server
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/1
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm test -w web
      - run: npm run build -w web
